<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Ahmad's Training Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Expanded:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF;
  --ink:#0A0A0A;
  --mute:#5C5C5C;
  --line:#D9D9D9;
  --field:#F0F0F0;
  --field-border:#C7C7C7;
  --accent:#A8D200;
  --accent-dim:#EAF7C8;
  --accent2:#FF5A36;
  --accent2-dim:#FFE3D9;
  --red:#C9311B;
  --green:#0F8A4F;
  --p1:#0A0A0A;
  --p2:#0A0A0A;
  --p3:#0A0A0A;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Archivo',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:90px;max-width:560px;margin:0 auto}
h1,h2,h3{margin:0;font-family:'Archivo Expanded',sans-serif;letter-spacing:-0.01em}
p{margin:0}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input,textarea,button{font-family:inherit;-webkit-appearance:none;appearance:none;color-scheme:light}
input,textarea{background-color:#fff;color:#0A0A0A}
input:focus,textarea:focus{outline:none}

/* ── Top header ── */
.app-head{padding:20px 18px 16px;position:sticky;top:0;background:var(--bg);z-index:30;border-bottom:1px solid var(--line)}
.app-head-row{display:flex;justify-content:space-between;align-items:center}
.app-logo{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.app-logo .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px}
.app-sub{font-size:11px;color:var(--mute);font-weight:600;margin-top:2px}

/* ── Bottom tab nav ── */
.tabnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:40;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.tabbtn{flex:1;border:none;background:none;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.tabbtn .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.tabbtn.on{color:var(--ink)}
.tabbtn.on .ic svg{stroke:var(--ink)}
.tabbtn .ic svg{stroke:var(--mute);transition:stroke .15s}

/* ── Tab panes ── */
.tabpane{display:none}
.tabpane.on{display:block}

/* ── Week selector strip ── */
.weeksel{display:flex;gap:8px;padding:14px 18px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.weeksel::-webkit-scrollbar{display:none}
.wpill{flex:0 0 auto;width:42px;height:42px;border-radius:13px;background:var(--field);border:1.5px solid var(--field-border);font-weight:800;font-size:14px;color:var(--mute);display:flex;align-items:center;justify-content:center;position:relative}
.wpill.on{background:var(--ink);border-color:var(--ink);color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.wpill.done::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--green)}

/* ── Week header card ── */
.wkhead{padding:4px 18px 18px}
.wkphase{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.wktitle{font-size:24px;font-weight:800;margin-top:4px;line-height:1.05}
.wkdesc{font-size:13px;color:var(--mute);font-weight:500;margin-top:8px;line-height:1.5}
.tmbtn{display:inline-flex;align-items:center;gap:6px;background:var(--field);border:none;border-radius:100px;padding:9px 16px;font-size:12px;font-weight:700;margin-top:12px}
.tmbtn:active{background:var(--line)}

/* ── Day card ── */
.daycard{margin:0 18px 14px;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.daycard.logged{border-color:var(--green);border-left:4px solid var(--green);background:linear-gradient(to right,rgba(15,138,79,.04) 0%,transparent 60%)}
.dayhead{padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.daynm{font-size:16px;font-weight:800}.daycard.logged .daynm{color:var(--green)}
.daytype{font-size:11px;color:var(--accent2);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
.daystatus{display:flex;align-items:center;gap:8px}
.logbadge{background:var(--accent);color:var(--ink);font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:100px}
.chev{width:18px;height:18px;transition:transform .2s}
.daycard.open .chev{transform:rotate(180deg)}
.daybody{display:none;padding:0 18px 18px}
.daycard.open .daybody{display:block}

/* ── Section within a day ── */
.seclabel{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.seclabel:first-child{margin-top:4px}
.seclabel::after{content:'';flex:1;height:1px;background:var(--line)}

/* ── Exercise block ── */
.exblock{margin-bottom:18px}
.supercard{border:1.5px solid var(--ink);border-radius:var(--radius-lg);padding:14px 14px 10px;margin-bottom:18px}
.superlabel{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:10px}
.superrest{font-weight:500;color:var(--mute);text-transform:none;letter-spacing:0}
.superpair{display:flex;gap:10px}
.supertag{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--accent2);text-transform:uppercase;margin-bottom:2px}
.superreason{font-size:11px;color:var(--mute);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);line-height:1.5}

/* ── Coach tab ── */
.coach-wrap{display:flex;flex-direction:column;height:calc(100vh - 120px);padding:0}
.coach-header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.coach-title{font-size:22px;font-weight:800;margin-bottom:3px}
.coach-sub{font-size:12px;color:var(--mute);line-height:1.5}
.coach-clear{background:none;border:none;font-size:11px;color:var(--mute);font-weight:600;padding:6px 0;margin-top:4px}
.coach-analysis-card{margin:14px 18px 0;background:var(--field);border:1.5px solid var(--green);border-radius:var(--radius-lg);padding:14px 16px}
.coach-analysis-label{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.coach-messages{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.coach-bubble{border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.6;max-width:88%;white-space:pre-wrap}
.coach-bubble-ai{background:var(--field);color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px}
.coach-bubble-user{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.coach-thinking{display:flex;gap:5px;align-items:center;padding:14px 16px}
.coach-thinking span{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:coachbounce 1.2s infinite}
.coach-thinking span:nth-child(2){animation-delay:.2s}
.coach-thinking span:nth-child(3){animation-delay:.4s}
.coach-thinking-inline{color:var(--mute);font-style:italic}
@keyframes coachbounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.coach-quickwrap{padding:10px 18px 6px}
.coach-quicklabel{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.coach-quickrow{display:flex;gap:7px;flex-wrap:wrap}
.coach-quick{background:var(--field);border:1.5px solid var(--field-border);border-radius:100px;padding:7px 13px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap}
.coach-quick:active{background:var(--ink);color:#fff;border-color:var(--ink)}
.coach-input-wrap{display:flex;gap:10px;align-items:flex-end;padding:10px 18px 14px;border-top:1px solid var(--line)}
.coach-input{flex:1;border:1.5px solid var(--field-border);border-radius:14px;padding:11px 13px;font-size:14px;background:var(--field);resize:none;max-height:100px;line-height:1.5}
.coach-input:focus{border-color:var(--ink);background:#fff}
.coach-send{width:40px;height:40px;border-radius:50%;background:var(--ink);border:none;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.coach-send:disabled{opacity:.4}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.exname{font-size:15px;font-weight:700}
.exname .tag{display:inline-block;background:var(--accent-dim);color:#5C6E0E;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:100px;margin-left:6px;vertical-align:2px}
.exscheme{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}
.exnote{font-size:12px;color:var(--mute);line-height:1.5;margin-bottom:10px}

/* ── Training max spec block (main lifts only) ── */
.specblock{background:var(--ink);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px;color:#fff;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden;box-shadow:0 6px 16px -8px rgba(168,210,0,.5)}
.specblock::after{content:'';position:absolute;top:-60%;right:-15%;width:120px;height:120px;background:radial-gradient(circle,var(--accent) 0%,transparent 70%);opacity:.25;pointer-events:none}
.specleft .l{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9A9A9A}
.specleft .v{font-size:22px;font-weight:800;margin-top:1px}
.specleft .v .u{font-size:12px;color:var(--accent);font-weight:700;margin-left:3px}
.specright{text-align:right}
.specright .l{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9A9A9A}
.specright .v{font-size:18px;font-weight:800;margin-top:1px}

/* ── Set rows ── */
.setgrid{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;align-items:center}
.setn{width:24px;height:24px;border-radius:7px;background:var(--field);border:1.5px solid var(--field-border);color:var(--mute);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.setn.amrap{background:var(--ink);border-color:var(--ink);color:var(--accent)}
.sinput{border:1.5px solid var(--field-border);border-radius:var(--radius-sm);padding:11px 12px;font-size:14px;font-weight:700;background:var(--field);width:100%;color:var(--ink)}
.sinput.filled{background:#fff;border-color:var(--ink);border-width:2px}
.sinput:focus{border-color:var(--ink);border-width:2px;background:#fff}
.sinput::placeholder{color:#8A8A8A;font-weight:600}

/* ── Effort selector ── */
.effortrow{display:flex;gap:6px;margin-top:10px}
.effbtn{flex:1;border:1.5px solid var(--field-border);background:var(--field);border-radius:var(--radius-sm);padding:9px 4px;font-size:11px;font-weight:700;color:var(--mute);text-align:center}
.effbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.effbtn.on.e{background:var(--green);border-color:var(--green)}
.effbtn.on.m{background:#2D6FBF;border-color:#2D6FBF}
.effbtn.on.h{background:#D98A1F;border-color:#D98A1F}
.effbtn.on.x{background:var(--red);border-color:var(--red)}

/* ── Recommendation strip (accessories) ── */
.recmsg{font-size:12px;font-weight:600;margin:6px 0 10px;padding:9px 12px;border-radius:var(--radius-sm);background:var(--field)}
.recmsg.up{color:var(--green);background:#EAFAF1}
.recmsg.dn{color:var(--red);background:#FCEEEB}

/* ── Cardio block ── */
.cardiocard{background:var(--field);border:1.5px solid var(--field-border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px}
.cardiogrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.cselect{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235C5C5C' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px}
.cardiohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cardiolabel{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.cardiormv{background:none;border:none;color:var(--red);font-size:11px;font-weight:700;padding:2px}
.cardioadd{width:100%;background:#fff;border:1.5px dashed var(--field-border);border-radius:var(--radius-md);padding:11px;font-size:12px;font-weight:700;color:var(--mute);text-align:center;margin-bottom:18px}
.cardioadd:active{background:var(--field)}
.cardiogrid .full{grid-column:1 / -1}
.cfield-label{font-size:10px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}

/* ── Notes ── */
.notesarea{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-md);padding:13px 14px;font-size:13px;font-family:inherit;background:var(--field);min-height:70px;resize:vertical;margin-top:4px;color:var(--ink)}
.notesarea::placeholder{color:#B8B8B8}

/* ── Buttons ── */
.btn-primary{background:var(--ink);color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em;text-transform:uppercase;border:none;border-radius:var(--radius-md);padding:15px;text-align:center;width:100%;margin-top:14px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
.btn-primary:active{transform:scale(.98);box-shadow:0 2px 8px -4px rgba(0,0,0,.3);opacity:.92}
.btn-ghost{background:none;color:var(--mute);font-weight:700;font-size:12px;border:none;padding:14px 8px;text-align:center}
.btn-row{display:flex;gap:8px;align-items:center}
.btn-row .btn-primary{flex:1;margin-top:14px}
.savedflag{display:none;text-align:center;font-size:11px;font-weight:700;color:var(--green);margin-top:8px}
.savedflag.on{display:block}

/* ── Protocol note (bad day) ── */
.protocol{margin:14px 0 0;background:var(--accent-dim);border-radius:var(--radius-md);padding:13px 14px}
.protocol .l{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#5C6E0E;margin-bottom:4px}
.protocol .t{font-size:12px;color:#3A4508;line-height:1.5}

/* ── Stat cards (overview) ── */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 18px}
.statcard{background:var(--field);border-radius:var(--radius-md);padding:14px 16px}
.statcard .l{font-size:10px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.statcard .v{font-size:26px;font-weight:800;margin-top:4px}
.statcard .v .u{font-size:13px;color:var(--mute);font-weight:700;margin-left:2px}
.statcard .d{font-size:11px;color:var(--mute);margin-top:2px;font-weight:600}

/* ── Generic content card ── */
.card{margin:0 18px 14px;background:var(--field);border-radius:var(--radius-lg);padding:18px}
.card .lbl{font-size:13px;font-weight:800;margin-bottom:8px}
.card p{font-size:13px;color:var(--mute);line-height:1.6}
.card p strong{color:var(--ink);font-weight:700}
.card ul{margin:0;padding-left:0;list-style:none}
.card li{font-size:13px;color:var(--mute);line-height:1.6;margin-bottom:10px;padding-left:18px;position:relative}
.card li::before{content:'';position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.card li strong{color:var(--ink);font-weight:700}

/* ── Phase row (overview) ── */
.phaserow{display:flex;gap:10px;padding:0 18px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.phaserow::-webkit-scrollbar{display:none}
.phasecard{flex:0 0 240px;border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px}
.phasecard .pt{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.phasecard .pw{font-size:18px;font-weight:800;margin-top:2px;margin-bottom:10px}
.phasecard ul{margin:0;padding-left:16px}
.phasecard li{font-size:12px;color:var(--mute);line-height:1.6;margin-bottom:4px}

/* ── Recalibration panel (overlay) ── */
.rcp-overlay{position:fixed;inset:0;background:rgba(10,10,10,.4);z-index:90;display:none;align-items:flex-end}
.rcp-overlay.on{display:flex}
.rcp{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:560px;margin:0 auto;max-height:85vh;overflow-y:auto;padding:22px 18px 30px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.rcp-title{font-size:18px;font-weight:800;margin-bottom:4px}
.rcp-sub{font-size:12px;color:var(--mute);line-height:1.5;margin-bottom:16px}
.rcp-item{border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;margin-bottom:10px}
.rcp-item .nm{font-size:14px;font-weight:700;margin-bottom:8px}
.rcp-item .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rcp-item .row .l{font-size:11px;color:var(--mute);font-weight:600}
.rcp-item .row input{border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;font-weight:700;width:90px;text-align:right}
.rcp-reason{font-size:11px;color:var(--mute);margin-top:6px;font-style:italic}
.rcp-close{position:sticky;top:0;display:flex;justify-content:flex-end;margin-bottom:6px}
.rcp-x{width:32px;height:32px;border-radius:50%;background:var(--field);border:none;font-size:16px;color:var(--mute)}

/* ── Fatigue score badge ── */
.fatiguebox{margin:0 18px 14px;border-radius:var(--radius-lg);padding:16px 18px;background:var(--field)}
.fatiguebox.y{background:#FFF8E5}
.fatiguebox.r{background:#FCEEEB}
.fatiguebox .ft{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.fatiguebox .fv{font-size:20px;font-weight:800;margin-top:4px}
.fatiguebox .fm{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.5}
</style>
</head>
<body>
<div class="app-head">
  <div class="app-head-row">
    <div>
      <div class="app-logo"><span class="dot"></span>Ahmad's Program</div>
      <div class="app-sub">5/3/1 Wave — Mon/Wed/Fri/Sat</div>
    </div>
  </div>
</div>

<div id="tab-ov" class="tabpane on"></div>
<div id="tab-log" class="tabpane"></div>
<div id="tab-rehab" class="tabpane"></div>
<div id="tab-prog" class="tabpane"></div>

<div class="rcp-overlay" id="rcpOverlay">
  <div class="rcp" id="rcp"></div>
</div>

<nav class="tabnav">
  <button class="tabbtn on" id="nav-ov" onclick="showTab('ov',this)">
    <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span>
    Overview
  </button>
  <button class="tabbtn" id="nav-log" onclick="showTab('log',this)">
    <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11v11h-11z"/><path d="M9 9h.01M9 13h6M9 16h6"/></svg></span>
    Log
  </button>
  <button class="tabbtn" id="nav-rehab" onclick="showTab('rehab',this)">
    <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg></span>
    Coach
  </button>

// ── Cardio exercise detection ──────────────────────────────────
// Any exercise name matching these patterns gets the cardio input treatment
// (duration + distance + effort) instead of weight/reps.
function isCardioExercise(name){
  return /Easy Bike|Incline Walk|Walk\/Jog|Continuous|Jog/i.test(name);
}
function isWarmupCardio(name){
  return name==='Easy Bike or Incline Walk'||name==='Easy Bike';
}

const TM={
  'Front Squat':           185,  // recalibrated from actual: hit 165x3 rated Hard on week 2 (3s week at 90%). Real TM ~185.

};
// 5/3/1 wave percentages by week-in-cycle (1=5s week, 2=3s week, 3=5/3/1 week, 4=deload)
const WAVE={
  1:[{pct:.65,reps:5},{pct:.75,reps:5},{pct:.85,reps:5,amrap:true}],
  2:[{pct:.70,reps:3},{pct:.80,reps:3},{pct:.90,reps:3,amrap:true}],
  3:[{pct:.75,reps:5},{pct:.85,reps:3},{pct:.95,reps:1,amrap:true}],
  4:[{pct:.40,reps:5},{pct:.50,reps:5},{pct:.60,reps:5}],
};
// TM increases applied at the start of each new cycle (after every 4th week / deload)
const TM_INCREMENT={'Front Squat':10,'Bench Press':5,'Trap Bar Deadlift':10,'Conventional Deadlift':10,'OHP':5};

function roundWeight(w){return Math.round(w/5)*5;} // round to nearest 5 lbs

// Get the current TM for a lift, accounting for completed cycles
function getCurrentTM(lift,weekNum){
  const adj=gA();
  const ak=`tm_${lift}`;
  if(adj[ak]!==undefined)return adj[ak];
  const cyclesCompleted=Math.floor((weekNum-1)/4);
  const inc=TM_INCREMENT[lift]||0;
  return (TM[lift]||0)+cyclesCompleted*inc;
}

// Get the wave-based weight prescription for a main lift on a given week
function getWaveSets(lift,weekNum){
  const weekInCycle=((weekNum-1)%4)+1;
  const tm=getCurrentTM(lift,weekNum);
  const wave=WAVE[weekInCycle];
  return wave.map(w=>({weight:roundWeight(tm*w.pct),reps:w.reps,amrap:w.amrap||false}));
}

function showTab(name,btn){
  document.querySelectorAll('.tabpane').forEach(t=>t.classList.remove('on'));
  document.getElementById('tab-'+name).classList.add('on');
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('on'));

  else document.getElementById('nav-'+name)?.classList.add('on');

function renderWeekSel(active){
  const log=gL();

    h+=`<button class="wpill${w.w===active?' on':''}${anyLogged?' done':''}" onclick="selWeek(${w.w})">${w.w}</button>`;

// ── Main Log tab renderer ───────────────────────────────────────
// Helper: renders a single accessory exercise block (used for both standalone and superset)
function renderAccessoryBlock(ex,ek,es,tag,lk,sv){
  let h='';
  const isCoreEx=!!CORE_EXS[ex.n];
  const p=PR[ex.pk||ex.n];
  const wMatch=lk.match(/^w(\d+)_/);
  const weekNum=wMatch?parseInt(wMatch[1]):1;

  h+=`<div class="exblock" style="flex:1;min-width:0">`;
  h+=`<div class="exhead"><div><div class="supertag">${tag}</div><div class="exname" style="font-size:13px">${ex.n}${ex.pr?'<span class="tag">Right Priority</span>':''}</div></div><div class="exscheme">${ex.s||''}</div></div>`;
  if(ex.nt)h+=`<div class="exnote">${ex.nt}</div>`;

  if(isCoreEx){
    // Core/bodyweight exercise -- just note, no weight tracking
    h+=`<div class="exnote" style="margin-top:4px;color:var(--mute)">Bodyweight / isometric</div>`;
  } else if(p){
    // Accessory with weight prescription
    const rec=getRec(ex.pk||ex.n,weekNum);
    const tw=rec?rec.w:p.w;
    if(rec&&rec.msg)h+=`<div class="recmsg ${rec.type==='up'?'up':rec.type==='dn'?'dn':''}">${rec.msg}</div>`;
    let sc=p.sc;
    if(ex.s){const sm=ex.s.match(/^(\d+)x/i);if(sm)sc=parseInt(sm[1]);}
    h+=`<div class="setgrid">`;
    for(let i=1;i<=sc;i++){
      const sd=(es.sets&&es.sets[i])||{};
      h+=`<div class="setrow">
        <div class="setn">${i}</div>
        <input class="sinput${sd.weight?' filled':''}" type="number" placeholder="${tw} lb" value="${sd.weight||''}" id="iw_${ek}_${i}" oninput="aS('${lk}','${ex.n}',${i})">
        <input class="sinput${sd.reps?' filled':''}" type="number" placeholder="${p.r} reps" value="${sd.reps||''}" id="ir_${ek}_${i}" oninput="aS('${lk}','${ex.n}',${i})">
      </div>`;
    }
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

function renderLog(num){
  const w=WKS.find(x=>x.w===num), log=gL(), cardio=gC();
  let h=`<div class="weeksel">${renderWeekSel(num)}</div>`;
  h+=`<div class="wkhead">
    <div class="wkphase">${pn[w.p]}</div>
    <div class="wktitle">${w.t}</div>
    <div class="wkdesc">${w.d}</div>
    <button class="tmbtn" onclick="openRCP(${num})">Adjust Training Max →</button>
  </div>`;

  w.days.forEach(day=>{
    const lk=`w${num}_${day.n.replace(/\s/g,'_')}`;
    const sv=log[lk]||{};
    const isLogged=!!sv.logged;
    h+=`<div class="daycard${isLogged?' logged':''}" id="dc_${lk}">`;
    h+=`<div class="dayhead" onclick="togDay('${lk}')">
      <div><div class="daynm">${day.n}</div><div class="daytype">${day.ty}</div></div>
      <div class="daystatus">${isLogged?'<span class="logbadge">Logged</span>':''}
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C8C8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>`;
    h+=`<div class="daybody">`;

    day.secs.forEach(sec=>{
      if(sec.l)h+=`<div class="seclabel">${sec.l}</div>`;
      const renderedPartners=new Set();
      sec.exs.forEach(ex=>{
        // Skip exercises already rendered as a superset partner
        if(renderedPartners.has(ex.n))return;

        const ek=`${lk}_${ex.n.replace(/[^a-zA-Z0-9]/g,'_')}`;
        const es=(sv.exercises&&sv.exercises[ex.n])||{};
        const isMainLift=TM[ex.n]!==undefined && ex.s && ex.s.includes('%');
        const isCardio=isCardioExercise(ex.n);
        const superDef=SUPERSETS[ex.n];

        // If this exercise has a superset partner, wrap both in a superset card
        if(superDef&&!isMainLift&&!isCardio){
          const partnerName=superDef.partner;
          const partnerEx=sec.exs.find(e=>e.n===partnerName)||CORE_EXS[partnerName]?{n:partnerName,...CORE_EXS[partnerName]}:null;
          if(partnerEx){
            renderedPartners.add(partnerName);
            const pek=`${lk}_${partnerName.replace(/[^a-zA-Z0-9]/g,'_')}`;
            const pes=(sv.exercises&&sv.exercises[partnerName])||{};
            const superLabel=superDef.tag[0]; // 'A' or 'B'
            h+=`<div class="supercard">
              <div class="superlabel">Superset ${superLabel} <span class="superrest">— rest 60-90s between pairs</span></div>
              <div class="superpair">`;
            // Render A1
            h+=renderAccessoryBlock(ex,ek,es,superDef.tag,lk,sv);
            // Render A2 partner
            h+=renderAccessoryBlock(partnerEx,pek,pes,superDef.partnerTag,lk,sv);
            h+=`</div><div class="superreason">${superDef.reason}</div></div>`;
            return;
          }
        }

        h+=`<div class="exblock">`;
        h+=`<div class="exhead"><div class="exname">${ex.n}${ex.pr?'<span class="tag">Right Priority</span>':''}</div><div class="exscheme">${ex.s||''}</div></div>`;
        if(ex.nt)h+=`<div class="exnote">${ex.nt}</div>`;

        if(isCardio){
          // ── Cardio input: multiple sessions per slot, each with type/duration/distance/effort ──
          const csessions=cardio[ek]&&cardio[ek].length?cardio[ek]:[{type:'',dur:'',dist:'',rpe:''}];
          h+=`<div id="cwrap_${ek}">`;
          csessions.forEach((cs,ci)=>{
            const showDist=cs.type==='Treadmill'||cs.type==='Bike';
            h+=`<div class="cardiocard" data-ci="${ci}">`;
            if(csessions.length>1){
              h+=`<div class="cardiohead"><span class="cardiolabel">Session ${ci+1}</span><button class="cardiormv" onclick="rmCardio('${ek}',${ci})">Remove</button></div>`;
            }
            h+=`<div class="cfield-label">Type</div>
              <select class="sinput cselect${cs.type?' filled':''}" id="cd_${ek}_${ci}_type" onchange="aC('${ek}',${ci})">
                <option value="" ${!cs.type?'selected':''}>Select...</option>
                <option value="Treadmill" ${cs.type==='Treadmill'?'selected':''}>Treadmill</option>
                <option value="Stairmaster" ${cs.type==='Stairmaster'?'selected':''}>Stairmaster</option>
                <option value="Elliptical" ${cs.type==='Elliptical'?'selected':''}>Elliptical</option>
                <option value="Bike" ${cs.type==='Bike'?'selected':''}>Bike</option>
                <option value="Other" ${cs.type==='Other'?'selected':''}>Other</option>
              </select>
              <div class="cardiogrid" style="margin-top:10px;grid-template-columns:${showDist?'1fr 1fr 1fr':'1fr 1fr'}">
                <div><div class="cfield-label">Duration</div><input class="sinput${cs.dur?' filled':''}" type="number" placeholder="min" value="${cs.dur||''}" id="cd_${ek}_${ci}_dur" oninput="aC('${ek}',${ci})"></div>
                ${showDist?`<div><div class="cfield-label">Distance</div><input class="sinput${cs.dist?' filled':''}" type="number" step="0.1" placeholder="mi" value="${cs.dist||''}" id="cd_${ek}_${ci}_dist" oninput="aC('${ek}',${ci})"></div>`:''}
                <div><div class="cfield-label">Effort</div><input class="sinput${cs.rpe?' filled':''}" type="text" placeholder="1-10" value="${cs.rpe||''}" id="cd_${ek}_${ci}_rpe" oninput="aC('${ek}',${ci})"></div>
              </div>
            </div>`;
          });
          h+=`</div>`;
          h+=`<button class="cardioadd" onclick="addCardio('${ek}')">+ Add Another Session</button>`;
        } else if(isMainLift){
          // ── Main lift: percentage-based wave sets from Training Max ──
          const sets=getWaveSets(ex.n,num);
          const tm=getCurrentTM(ex.n,num);
          h+=`<div class="specblock">
            <div class="specleft"><div class="l">Training Max</div><div class="v">${tm}<span class="u">LB</span></div></div>
            <div class="specright"><div class="l">Top Set</div><div class="v">${sets[sets.length-1].weight} × ${sets[sets.length-1].reps}${sets[sets.length-1].amrap?'+':''}</div></div>
          </div>`;
          h+=`<div class="setgrid">`;
          sets.forEach((s,idx)=>{
            const setNum=idx+1;
            const sd=(es.sets&&es.sets[setNum])||{};
            const isNew=!sd.weight;
            h+=`<div class="setrow">
              <div class="setn${s.amrap?' amrap':''}">${setNum}${s.amrap?'+':''}</div>
              <input class="sinput${sd.weight?' filled':''}" type="number" placeholder="${s.weight} lb" value="${isNew?'':sd.weight}" id="iw_${ek}_${setNum}" oninput="aS('${lk}','${ex.n}',${setNum})">
              <input class="sinput${sd.reps?' filled':''}" type="number" placeholder="${s.reps}${s.amrap?'+':''} reps" value="${sd.reps||''}" id="ir_${ek}_${setNum}" oninput="aS('${lk}','${ex.n}',${setNum})">
            </div>`;
          });
          h+=`</div>`;
          const rpe=es.rpe||'';
          h+=`<div class="effortrow">`;
          [{v:'Easy',c:'e'},{v:'Moderate',c:'m'},{v:'Hard',c:'h'},{v:'Max',c:'x'}].forEach(r=>{
            h+=`<button class="effbtn${rpe===r.v?' on '+r.c:''}" onclick="setRPE('${lk}','${ex.n}','${r.v}','${ek}')">${r.v}</button>`;
          });
          h+=`</div>`;
        } else if(ex.pk && PR[ex.pk]){
          // ── Accessory: flat weight progression ──
          const p=PR[ex.pk];
          let sc=p.sc;
          if(ex.s){const sm=ex.s.match(/^(\d+)x/i);if(sm)sc=parseInt(sm[1]);}
          const rec=getRec(ex.pk,num);
          const tw2=rec?rec.w:getPW(ex.pk,num);
          if(rec&&rec.msg){
            const rCls=rec.type==='up'?'up':rec.type==='dn'?'dn':'';
            h+=`<div class="recmsg ${rCls}">${rec.msg}</div>`;
          }
          h+=`<div class="setgrid">`;
          for(let i=1;i<=sc;i++){
            const sd=(es.sets&&es.sets[i])||{};
            const isNew=!sd.weight;
            h+=`<div class="setrow">
              <div class="setn">${i}</div>
              <input class="sinput${sd.weight?' filled':''}" type="number" placeholder="${tw2} lb" value="${isNew?'':sd.weight}" id="iw_${ek}_${i}" oninput="aS('${lk}','${ex.n}',${i})">
              <input class="sinput${sd.reps?' filled':''}" type="number" placeholder="${p.r} reps" value="${sd.reps||''}" id="ir_${ek}_${i}" oninput="aS('${lk}','${ex.n}',${i})">
            </div>`;
          }
          h+=`</div>`;
          const rpe=es.rpe||'';
          h+=`<div class="effortrow">`;
          [{v:'Easy',c:'e'},{v:'Moderate',c:'m'},{v:'Hard',c:'h'},{v:'Max',c:'x'}].forEach(r=>{
            h+=`<button class="effbtn${rpe===r.v?' on '+r.c:''}" onclick="setRPE('${lk}','${ex.n}','${r.v}','${ek}')">${r.v}</button>`;
          });
          h+=`</div>`;
        } else if(ex.s){
          h+=`<div class="exnote" style="margin-top:-2px">Log: ${ex.s}</div>`;
        }
        h+=`</div>`;
      });
    });

    const sn=sv.notes||'';
    h+=`<div class="seclabel">Session Notes</div>
      <textarea class="notesarea" id="sn_${lk}" placeholder="How did it feel? Pain? PRs? Adjust next time?">${sn}</textarea>

    h+=`</div></div>`;

  document.getElementById('tab-log').innerHTML=h;

// ── Input handlers ───────────────────────────────────────────
// aS is called via oninput on every weight/rep field. It now saves
// immediately to localStorage so nothing is lost if you navigate away
// or switch weeks without tapping Save Session. Save Session still
// marks the day as "Logged" and triggers the Training Max adjustment.
function aS(lk,exName,setNum){
  const log=gL();if(!log[lk])log[lk]={};
  if(!log[lk].exercises)log[lk].exercises={};
  if(!log[lk].exercises[exName])log[lk].exercises[exName]={sets:{}};
  const ek=`${lk}_${exName.replace(/[^a-zA-Z0-9]/g,'_')}`;
  const wEl=document.getElementById(`iw_${ek}_${setNum}`);
  const rEl=document.getElementById(`ir_${ek}_${setNum}`);
  const prev=log[lk].exercises[exName].sets[setNum]||{};
  log[lk].exercises[exName].sets[setNum]=Object.assign({},prev,{
    weight:wEl?wEl.value:prev.weight||'',
    reps:rEl?rEl.value:prev.reps||''
  });
  sL(log);
}
document.addEventListener('input',e=>{
  if(e.target.classList.contains('sinput')){
    e.target.classList.toggle('filled',!!e.target.value);
  }
});

function aC(ek,ci){
  const cardio=gC();
  if(!cardio[ek]||!cardio[ek].length)cardio[ek]=[{type:'',dur:'',dist:'',rpe:''}];
  const type=document.getElementById(`cd_${ek}_${ci}_type`)?.value||'';
  const dur=document.getElementById(`cd_${ek}_${ci}_dur`)?.value||'';
  const distEl=document.getElementById(`cd_${ek}_${ci}_dist`);
  const dist=distEl?distEl.value:(cardio[ek][ci]?.dist||'');
  const rpe=document.getElementById(`cd_${ek}_${ci}_rpe`)?.value||'';
  const prevType=cardio[ek][ci]?.type;
  cardio[ek][ci]={type,dur,dist,rpe};
  sC(cardio);
  // If the type changed in a way that toggles the distance field's visibility, re-render this day
  const showDistNow=type==='Treadmill'||type==='Bike';
  const showedDistBefore=prevType==='Treadmill'||prevType==='Bike';
  if(showDistNow!==showedDistBefore)reRenderKeepOpen();
}

function addCardio(ek){
  const cardio=gC();
  if(!cardio[ek]||!cardio[ek].length)cardio[ek]=[{type:'',dur:'',dist:'',rpe:''}];
  cardio[ek].push({type:'',dur:'',dist:'',rpe:''});
  sC(cardio);
  reRenderKeepOpen();
}

function rmCardio(ek,ci){
  const cardio=gC();
  if(!cardio[ek])return;
  cardio[ek].splice(ci,1);
  if(!cardio[ek].length)cardio[ek]=[{type:'',dur:'',dist:'',rpe:''}];
  sC(cardio);
  reRenderKeepOpen();
}

// Re-render the Log tab while keeping whichever day card was open, open
function reRenderKeepOpen(){
  const openCard=document.querySelector('.daycard.open');
  const openId=openCard?openCard.id:null;
  renderLog(cW);
  if(openId)setTimeout(()=>document.getElementById(openId)?.classList.add('open'),0);
}

function setRPE(lk,exName,val,ek){
  const log=gL();if(!log[lk])log[lk]={};
  if(!log[lk].exercises)log[lk].exercises={};
  if(!log[lk].exercises[exName])log[lk].exercises[exName]={sets:{}};
  log[lk].exercises[exName].rpe=val;
  sL(log);
  // Update buttons visually without full re-render
  document.querySelectorAll(`[onclick*="setRPE('${lk}','${exName}'"]`).forEach(b=>{
    b.classList.remove('on','e','m','h','x');
  });
  const map={Easy:'e',Moderate:'m',Hard:'h',Max:'x'};
  const btn=Array.from(document.querySelectorAll(`[onclick*="setRPE('${lk}','${exName}','${val}'"]`))[0];
  if(btn)btn.classList.add('on',map[val]);
}

// ── Save session: flush all inputs for this day into storage ──
function saveS(lk){
  const log=gL();if(!log[lk])log[lk]={};
  document.querySelectorAll(`#dc_${lk} [id^="iw_${lk}_"]`).forEach(el=>{
    if(!el.value)return;
    const parts=el.id.replace(`iw_${lk}_`,'').split('_');
    const setNum=parts.pop();
    const exnEl=el.closest('.exblock')?.querySelector('.exname');
    if(!exnEl)return;
    const nm=exnEl.textContent.replace('Right Priority','').trim();
    const reEl=document.getElementById(el.id.replace('iw_','ir_'));

// Returns array of 12 entries (one per week), each being the top set weight
// logged for a given lift that week, or null if not logged.
function getProgressionData(liftName){
  const log=gL();
  return Array.from({length:12},(_,i)=>{
    const wk=i+1;
    // Saturday alternates deadlift/press -- check both day names
    const dayKeys=[
      `w${wk}_Monday`, `w${wk}_Wednesday`, `w${wk}_Friday`,
      `w${wk}_Saturday`, `w${wk}_Sunday`
    ];
    let topWeight=null;
    dayKeys.forEach(dk=>{
      const session=log[dk];
      if(!session||!session.exercises)return;
      const ex=session.exercises[liftName];
      if(!ex||!ex.sets)return;
      Object.values(ex.sets).forEach(s=>{
        const w=parseFloat(s.weight);
        if(w&&(!topWeight||w>topWeight))topWeight=w;
      });
    });
    return topWeight;
  });
}

// Compute week streak -- consecutive weeks with at least one session logged
function calcStreak(){
  const log=gL();
  let streak=0;
  for(let wk=cW;wk>=1;wk--){
    const days=['Monday','Wednesday','Friday','Saturday','Sunday'];
    const anyLogged=days.some(d=>log[`w${wk}_${d}`]?.logged);
    if(anyLogged)streak++;
    else break;
  }
  return streak;
}

// Renders the progression mini-charts into the overview
// Called after Chart.js is confirmed loaded
function renderProgressCharts(){
  if(typeof Chart==='undefined')return; // Chart.js not loaded yet, skip gracefully
  const lifts=[
    {name:'Front Squat',   key:'fs'},
    {name:'Bench Press',   key:'bp'},
    {name:'Trap Bar Deadlift', key:'dl'},
    {name:'OHP',           key:'ohp'},
  ];

  lifts.forEach(lift=>{
    const canvas=document.getElementById(`prog_${lift.key}`);
    if(!canvas)return;
    // Destroy previous instance if re-rendering
    const existing=Chart.getChart(canvas);
    if(existing)existing.destroy();

    const data=getProgressionData(lift.name);
    const filledData=data.map((v,i)=>v!==null?v:null);
    const lastVal=data.filter(v=>v!==null).slice(-1)[0]||null;
    const firstVal=data.find(v=>v!==null)||null;
    const delta=lastVal&&firstVal&&lastVal!==firstVal?lastVal-firstVal:null;

    // Update the delta display
    const deltaEl=document.getElementById(`delta_${lift.key}`);
    if(deltaEl){
      if(delta!==null){
        deltaEl.textContent=(delta>0?'+':'')+delta+' lb';
        deltaEl.style.color=delta>0?'#0F8A4F':delta<0?'#C9311B':'var(--mute)';
      } else if(lastVal){
        deltaEl.textContent='first session';
        deltaEl.style.color='var(--mute)';
      } else {
        deltaEl.textContent='not logged yet';
        deltaEl.style.color='var(--mute)';
      }
    }

    // Top set display
    const topEl=document.getElementById(`top_${lift.key}`);
    if(topEl)topEl.textContent=lastVal?lastVal+'':'--';

    const validMin=Math.min(...data.filter(v=>v!==null));
    const validMax=Math.max(...data.filter(v=>v!==null));
    const pad=(validMax-validMin)*0.3||20;

    new Chart(canvas,{
      type:'line',
      data:{
        labels:['W1','W2','W3','W4','W5','W6','W7','W8','W9','W10','W11','W12'],
        datasets:[{
          data:filledData,
          borderColor:'#2a78d6',
          backgroundColor:'rgba(42,120,214,0.07)',
          borderWidth:2,
          pointBackgroundColor:'#2a78d6',
          pointBorderColor:'#ffffff',
          pointBorderWidth:2,
          pointRadius:filledData.map(v=>v!==null?4:0),
          tension:0.3,
          fill:true,
          spanGaps:false
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        animation:{duration:400},
        plugins:{legend:{display:false},tooltip:{enabled:false}},
        scales:{
          x:{display:false,grid:{display:false}},
          y:{
            display:false,
            min:validMin-pad,
            max:validMax+pad,
            grid:{display:false}
          }
        }
      }
    });
  });
}

function buildPostSessionAnalysis(lk, session){
  const wMatch=lk.match(/^w(\d+)_(.+)/);
  if(!wMatch)return null;
  const weekNum=parseInt(wMatch[1]);
  const dayName=wMatch[2].replace(/_/g,' ');

  const exLines=Object.entries(session.exercises||{}).map(([name,ex])=>{
    const sets=Object.values(ex.sets||{});
    const weights=sets.map(s=>s.weight).filter(Boolean).join('/');
    const reps=sets.map(s=>s.reps).filter(Boolean).join('/');
    return `- ${name}: ${weights}lb x ${reps} reps | Felt: ${ex.rpe||'unrated'}`;
  }).join('\n');

  return `Analyze this just-completed session and give specific, actionable feedback.

SESSION: Week ${weekNum}, ${dayName}
${exLines}
${session.notes?'Notes: '+session.notes:''}

Give feedback on:
1. Performance vs where they should be at this point in the program
2. Any RPE flags (anything rated Hard or Max that warrants attention)
3. One specific thing to focus on next session
4. Any recovery or rehab note relevant to the knee or back based on what was logged

Keep it under 150 words. Be direct, specific, no fluff.`;
}

async function callCoach(userMessage, systemPrompt, isAnalysis=false){
  const messages = isAnalysis
    ? [{role:'user', content: userMessage}]
    : [...coachHistory, {role:'user', content: userMessage}];

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt || getAhmadContext(),
        messages: messages
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || 'No response received.';
    if(!isAnalysis){
      coachHistory.push({role:'user', content: userMessage});
      coachHistory.push({role:'assistant', content: text});
      // Keep history to last 10 turns to avoid token bloat
      if(coachHistory.length > 20) coachHistory = coachHistory.slice(-20);
    }
    return text;
  } catch(e) {
    return 'Connection error. Make sure you are online and try again.';
  }
}

function coachKeydown(e){

async function sendCoachMsg(){
  const input = document.getElementById('coach-input');
  const msg = input?.value?.trim();
  if(!msg) return;
  input.value = '';
  appendCoachMsg(msg, 'user');
  const sendBtn = document.getElementById('coach-send');
  if(sendBtn) sendBtn.disabled = true;
  appendCoachThinking();
  const reply = await callCoach(msg);
  removeCoachThinking();
  appendCoachMsg(reply, 'ai');
  if(sendBtn) sendBtn.disabled = false;
}

async function sendQuick(msg){
  appendCoachMsg(msg, 'user');
  const sendBtn = document.getElementById('coach-send');
  if(sendBtn) sendBtn.disabled = true;
  appendCoachThinking();
  const reply = await callCoach(msg);
  removeCoachThinking();
  appendCoachMsg(reply, 'ai');
  if(sendBtn) sendBtn.disabled = false;
}

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;

function appendCoachThinking(){
  const msgs = document.getElementById('coach-messages');

function roundWeight(w){return Math.round(w/5)*5;}

function getCurrentTM(lift,weekNum){
  const adj=gA();
  const ak=`tm_${lift}`;
  if(adj[ak]!==undefined)return adj[ak];
  const cyclesCompleted=Math.floor((weekNum-1)/4);
  const inc=TM_INCREMENT[lift]||0;
  return (TM[lift]||0)+cyclesCompleted*inc;
}

function getWaveSets(lift,weekNum){
  const weekInCycle=((weekNum-1)%4)+1;
  const tm=getCurrentTM(lift,weekNum);
  const wave=WAVE[weekInCycle];
  return wave.map(w=>({weight:roundWeight(tm*w.pct),reps:w.reps,amrap:w.amrap||false}));
}

function getPW(pk,wn){
  if(!pk||!PR[pk])return null;
  const adj=gA(), p=PR[pk];
  const ak=`adj_${pk}`;
  // Manual recalibration override takes highest priority
  if(adj[ak]!==undefined)return adj[ak];
  // Auto-calculate from last logged session + recommendation
  const rec=getRecRaw(pk);
  if(rec&&rec.type!=='start')return rec.w;
  // Fall back to base + phase bonus if nothing logged yet
  const bonus=wn<=4?0:wn<=8?p.pg*2:p.pg*4;
  return p.w+bonus;
}

function getBest(nm){
  // Returns the most recent session that logged this exercise
  // (not all-time best -- we want week-over-week progression, not chasing a peak)
  const log=gL(); let best=null, lastDate=null;
  Object.entries(log).forEach(([k,s])=>{
    if(!s.exercises||!s.exercises[nm]||!s.savedAt)return;
    if(lastDate&&s.savedAt<=lastDate)return;
    const ex=s.exercises[nm];
    if(!ex.sets)return;
    // Get the top weight logged in this session
    let topW=null, topR=null;
    Object.values(ex.sets).forEach(set=>{
      const w=parseFloat(set.weight);
      if(!w)return;
      if(!topW||w>topW){topW=w;topR=set.reps;}
    });
    if(topW){best={w:topW,r:topR,k,rpe:ex.rpe};lastDate=s.savedAt;}
  });
  return best;
}

function getLastRPE(nm){
  const log=gL(); let ld=null,rpe=null;
  Object.entries(log).forEach(([k,s])=>{
    if(!s.exercises||!s.exercises[nm]||!s.exercises[nm].rpe)return;
    if(!ld||(s.savedAt&&s.savedAt>ld)){ld=s.savedAt||k;rpe=s.exercises[nm].rpe;}
  });
  return rpe;
}

function hitAllReps(nm){
  const log=gL(); let ls=null,ld=null;
  Object.entries(log).forEach(([k,s])=>{
    if(!s.exercises||!s.exercises[nm])return;
    if(!ld||(s.savedAt&&s.savedAt>ld)){ld=s.savedAt||k;ls=s.exercises[nm];}
  });
  if(!ls||!ls.sets)return true;
  const sets=Object.values(ls.sets);
  if(!sets.length)return true;
  // Consider reps hit if: reps were logged OR checkmark ticked
  // Don't penalise for not using the checkmark
  return sets.every(s=>s.done||(s.reps&&parseFloat(s.reps)>0));
}

function getRecRaw(pk){
  if(!pk||!PR[pk])return null;
  const p=PR[pk], best=getBest(pk), rpe=getLastRPE(pk), hit=hitAllReps(pk);
  if(!best)return{type:'start',w:p.w,msg:''};
  // hit = reps were entered for all sets (checkmark NOT required)
  // Only drop if reps were genuinely skipped/empty
  if(!hit){
    const dw=Math.round(best.w*.95/2.5)*2.5;
    return{type:'dn',w:dw,msg:`Missed reps last session. Drop to ${dw} lbs and build back clean.`};
  }
  if(rpe==='Max'){
    return{type:'same',w:best.w,msg:`Rated Max effort. Hold at ${best.w} lbs -- earn it before going up.`};
  }
  if(rpe==='Hard'){
    return{type:'same',w:best.w,msg:`Rated Hard. Stay at ${best.w} lbs.`};
  }
  if(rpe==='Easy'){
    const uw=best.w+p.pg*2;
    return{type:'up',w:uw,msg:`Felt Easy. Jump ${p.pg*2} lbs to ${uw}.`};
  }
  if(rpe==='Moderate'){
    const uw=best.w+p.pg;
    return{type:'up',w:uw,msg:`All reps at Moderate. +${p.pg} lbs to ${uw}.`};
  }
  // No RPE logged but reps were entered -- conservative +prog
  const uw=best.w+p.pg;
  return{type:'up',w:uw,msg:`Reps logged, no RPE set. Conservative +${p.pg} lbs to ${uw}.`};
}

function getRec(pk,wn){
  if(!pk||!PR[pk])return null;
  const cur=getPW(pk,wn);
  const rec=getRecRaw(pk);
  if(!rec||rec.type==='start')return{type:'start',w:cur,msg:`Start at ${cur} lbs -- calibrated from your training history.`};
  // Attach the current computed weight (may be overridden by manual adj)
  return Object.assign({},rec,{w:cur});
}

// ── Auto-adjust Training Max based on what was actually logged ──
// Uses actual logged weight and reps on the top set to calculate a real
// estimated 1RM, then sets TM = 90% of that. This means the program learns
// from what you actually lifted, not just whether you were above/below prescription.
// Formula: estimated 1RM = weight x (1 + reps/30) -- standard Epley formula.
function adjustTMFromLog(lk,session){
  if(!session||!session.exercises)return[];
  const wMatch=lk.match(/^w(\d+)_/);
  if(!wMatch)return[];
  const weekNum=parseInt(wMatch[1]);
  const adj=gA();
  const changes=[];

  Object.keys(TM).forEach(lift=>{
    const exLog=session.exercises[lift];
    if(!exLog||!exLog.sets)return;
    const sets=Object.values(exLog.sets);
    if(!sets.length)return;

    // Find the heaviest set with reps logged
    let topLogged=null;
    sets.forEach(s=>{
      const w=parseFloat(s.weight);
      const r=parseFloat(s.reps);
      if(!w||!r)return;
      if(!topLogged||w>topLogged.w)topLogged={w,r};
    });
    if(!topLogged)return;

    const curTM=getCurrentTM(lift,weekNum);
    const tmKey=`tm_${lift}`;
    const rpe=exLog.rpe;

    // Calculate estimated 1RM from actual top set (Epley formula)
    const est1RM=topLogged.w*(1+topLogged.r/30);
    // New TM = 90% of estimated 1RM, rounded to nearest 5
    const newTMFromActual=roundWeight(est1RM*0.9);
    const diff=newTMFromActual-curTM;

    // If it felt like Max effort, don't bump TM up even if math says so -- hold
    if(rpe==='Max'&&diff>0)return;

    // Only update if meaningfully different (more than 5 lb change)
    if(Math.abs(diff)>5){
      adj[tmKey]=newTMFromActual;
      const direction=diff>0?'raised':'eased';
      changes.push(`${lift} TM ${direction} to ${newTMFromActual} lb (from ${topLogged.w}x${topLogged.r} @ ${rpe||'unrated'}).`);
    }
  });
  sA(adj);
  return changes;
}


function calcFS(){
  const log=gL(), nutr=gN();
  const rm={Easy:1,Moderate:5,Hard:8,Max:10};
  let rpes=[], hc=0;
  const cut=new Date(); cut.setDate(cut.getDate()-7);
  Object.values(log).forEach(s=>{
    if(!s.logged||!s.savedAt||new Date(s.savedAt)<cut)return;
    if(s.exercises) Object.values(s.exercises).forEach(e=>{
      if(e.rpe){rpes.push(rm[e.rpe]||0);if(e.rpe==='Hard'||e.rpe==='Max')hc++;}
    });
  });
  const rec=nutr.filter(e=>(new Date()-new Date(e.date+'T12:00:00'))/86400000<=7);
  let sl=0,st=0,en=0;
  rec.forEach(e=>{
    if(e.sleep) sl+=e.sleep<6?3:e.sleep<7?1:0;
    if(e.stress) st+=e.stress>=8?3:e.stress>=6?1:0;
    const fm={great:0,good:0,ok:1,bad:3};
    if(e.feeling) en+=fm[e.feeling]||0;
  });
  if(!rpes.length&&!rec.length)return null;
  const avg=rpes.length?rpes.reduce((a,b)=>a+b)/rpes.length:5;
  const score=(avg/10)*4+Math.min(hc*0.5,2)+Math.min((sl+st+en)*0.3,4);
  return Math.min(10,Math.round(score*10)/10);
}

function fInfo(sc){
  if(sc===null)return{cls:'g',title:'No Data',msg:'Log sessions to calculate fatigue score.',rec:''};
  if(sc<=5)return{cls:'g',title:'Recovering Well',msg:'Load is sustainable. Training normally.',rec:'Keep training.'};
  if(sc<=7)return{cls:'y',title:'Caution Zone',msg:'Accumulated fatigue detected. Prioritize sleep and nutrition this week.',rec:'Consider reducing volume 20%.'};
  return{cls:'r',title:'Deload Recommended',msg:'High fatigue load. A deload week will result in a bigger strength jump than another hard week right now.',rec:'Drop to 50-60% load.'};
}
